name: Import partner inquiries

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: import-partner-inquiries
  cancel-in-progress: false

jobs:
  import:
    name: Import from Gmail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Import partner inquiries
        run: bash scripts/trigger-partner-inquiry-import.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
