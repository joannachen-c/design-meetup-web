name: Set Preview Stripe Env

# One-shot helper: writes Stripe preview env vars via Vercel CLI using the
# existing VERCEL_TOKEN Actions secret. Does not touch Production.
on:
  workflow_dispatch:
    inputs:
      stripe_secret_key:
        description: STRIPE_SECRET_KEY (test)
        required: true
        type: string
      stripe_publishable_key:
        description: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (test)
        required: true
        type: string
      stripe_webhook_secret:
        description: STRIPE_WEBHOOK_SECRET
        required: true
        type: string
      stripe_price_student:
        description: STRIPE_PRICE_STUDENT_MONTHLY
        required: true
        type: string
      stripe_price_professional:
        description: STRIPE_PRICE_PROFESSIONAL_MONTHLY
        required: true
        type: string
      site_url:
        description: NEXT_PUBLIC_SITE_URL for preview
        required: true
        type: string

jobs:
  set-env:
    name: Set Preview Env + Redeploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Upsert Preview env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STRIPE_SECRET_KEY: ${{ inputs.stripe_secret_key }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ inputs.stripe_publishable_key }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe_webhook_secret }}
          STRIPE_PRICE_STUDENT_MONTHLY: ${{ inputs.stripe_price_student }}
          STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ inputs.stripe_price_professional }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STRIPE_SECRET_KEY"
          echo "::add-mask::$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          echo "::add-mask::$STRIPE_WEBHOOK_SECRET"

          upsert() {
            local name="$1"
            local value="$2"
            vercel env rm "$name" preview --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" preview --token="$VERCEL_TOKEN"
            echo "set $name (preview)"
          }

          upsert STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          upsert NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          upsert STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          upsert STRIPE_PRICE_STUDENT_MONTHLY "$STRIPE_PRICE_STUDENT_MONTHLY"
          upsert STRIPE_PRICE_PROFESSIONAL_MONTHLY "$STRIPE_PRICE_PROFESSIONAL_MONTHLY"
          upsert NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL"

          echo "Listing preview env names:"
          vercel env ls preview --token="$VERCEL_TOKEN" | sed -E 's/(sk_|pk_|whsec_)[A-Za-z0-9_]+/\1***/g' || true

      - name: Redeploy preview for portal PR branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Force a new preview deployment of this branch so env is picked up.
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/deploy.log | tail -n1)
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" > /tmp/preview-url.txt
        id: deploy

      - name: Comment webhook URL on PR #60
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('/tmp/preview-url.txt', 'utf8').trim().replace(/\/$/, '');
            const marker = '<!-- stripe-preview-env-bot -->';
            const body = [
              marker,
              '### Stripe Preview env set',
              '',
              `Preview: ${url}`,
              '',
              'Webhook endpoint (add Vercel bypass query if Deployment Protection is on):',
              '',
              '```',
              `${url}/api/stripe/webhook`,
              '```',
              '',
              '_Preview only — Production untouched._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 60,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 60,
                body,
              });
            }
