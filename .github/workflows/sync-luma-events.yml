name: Sync Luma events

# Adds every Luma calendar event that has ended to the past-events shelf:
# writes past-events.json via sync:luma, publishes to Supabase via
# seed:events, then commits the data so the repo stays the source of truth.
# The homepage revalidates from Supabase every 5 minutes, so no deploy is needed.
on:
  workflow_dispatch:
  schedule:
    # 07:00 PT, the morning after an evening event.
    - cron: "0 14 * * *"

concurrency:
  group: sync-luma-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync past events from Luma
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://sngjttldklmgyzebikxv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync past-events.json with Luma
        run: npm run sync:luma

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- scripts/data/past-events.json src/data/event-summaries.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new on Luma."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish before committing so a failed seed leaves main untouched and
      # the next run retries the same events.
      - name: Publish to Supabase
        if: steps.changes.outputs.changed == 'true'
        run: npm run seed:events

      - name: Commit synced events
        if: steps.changes.outputs.changed == 'true'
        run: |
          added=$(git diff -U0 -- scripts/data/past-events.json \
            | sed -n 's/^+    "title": "\(.*\)",$/\1/p' \
            | paste -sd ';' - | sed 's/;/; /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/past-events.json src/data/event-summaries.json
          git commit -m "Sync past events from Luma" -m "${added:+Added: $added}"
          git push origin HEAD:main
