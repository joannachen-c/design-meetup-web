name: Vercel Preview

# Deploys every PR with Michelle's Vercel token so collaborators who are not
# on the Vercel project still get preview URLs and a green deploy check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Fork PRs do not receive repository secrets — skip cleanly.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` reports an invalid token as "Could not retrieve Project
      # Settings", which points at .vercel instead of the real cause.
      - name: Verify Vercel token
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN is invalid or expired. Create a new token at https://vercel.com/account/tokens and update it under Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-bot -->';
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **URL** | ${url} |`,
              `| **Commit** | \`${sha}\` |`,
              '',
              '_Deployed via GitHub Actions so contributors do not need Vercel project access._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
