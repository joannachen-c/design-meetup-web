name: Vercel Preview

# Deploys every PR with Michelle's Vercel token so collaborators who are not
# on the Vercel project still get preview URLs and a green deploy check.
#
# Uses the Vercel REST API (not the CLI). App/integration tokens (vcp_*) can
# create deployments via the API but fail on `vercel whoami` / `vercel pull`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Fork PRs do not receive repository secrets — skip cleanly.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Verify Vercel token
        run: |
          code=$(curl -sS -o /tmp/vercel-projects.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN cannot access project (HTTP $code). Create a token at https://vercel.com/account/tokens and confirm VERCEL_ORG_ID / VERCEL_PROJECT_ID."
            cat /tmp/vercel-projects.json
            exit 1
          fi

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg name "design-meetup-web" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "${{ github.event.pull_request.head.ref }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            '{
              name: $name,
              project: $project,
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref,
                sha: $sha
              }
            }')

          response=$(curl -sS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")

          id=$(echo "$response" | jq -r '.id // empty')
          url=$(echo "$response" | jq -r '.url // empty')
          if [ -z "$id" ] || [ -z "$url" ]; then
            echo "$response" | jq .
            echo "::error::Failed to create Vercel preview deployment."
            exit 1
          fi

          echo "Created deployment $id → https://$url"

          # Wait until the deployment is READY or fails.
          for i in $(seq 1 90); do
            status_json=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}")
            state=$(echo "$status_json" | jq -r '.readyState // empty')
            echo "readyState=$state (attempt $i)"
            case "$state" in
              READY)
                alias=$(echo "$status_json" | jq -r '(.alias // [])|.[0] // .url')
                echo "url=https://${alias}" >> "$GITHUB_OUTPUT"
                echo "Preview URL: https://${alias}"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "$status_json" | jq .
                echo "::error::Vercel deployment ended in $state"
                exit 1
                ;;
            esac
            sleep 4
          done

          echo "::error::Timed out waiting for Vercel deployment $id"
          exit 1

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-bot -->';
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **URL** | ${url} |`,
              `| **Commit** | \`${sha}\` |`,
              '',
              '_Deployed via GitHub Actions so contributors do not need Vercel project access._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
