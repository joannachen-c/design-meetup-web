name: Vercel Preview

# Deploys every PR with Michelle's Vercel token so collaborators who are not
# on the Vercel project still get preview URLs and a green deploy check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Fork PRs do not receive repository secrets — skip cleanly.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` reports bad auth OR wrong project IDs as the same
      # "Could not retrieve Project Settings" message.
      - name: Verify Vercel token
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN is invalid or expired. Create a new token at https://vercel.com/account/tokens and update it under Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Link Vercel project
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      # Preview Stripe + Supabase env via Vercel API (avoid interactive CLI prompts).
      # Git-integration aliases (e.g. design-meetup-1frw5fo0m) only pick these up
      # after they exist on the project Preview target — teamId is required.
      # Copy production Stripe credentials. The previous hardcoded test secret
      # was revoked, so Update card / View in Stripe 401'd on every preview.
      - name: Upsert Preview Stripe env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TEAM="teamId=$VERCEL_ORG_ID"

          list_env() {
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?$TEAM"
          }

          # Only delete Preview-only records. A record shared with Production
          # (e.g. "Production and Preview") keeps Production and just drops the
          # preview target; deleting it would wipe the Production value.
          delete_preview() {
            local key="$1"
            list_env | KEY="$key" python3 -c '
          import os, sys, json
          k = os.environ["KEY"]
          for e in json.load(sys.stdin).get("envs", []):
              targets = e.get("target") or []
              if e.get("key") != k or "preview" not in targets:
                  continue
              rest = [t for t in targets if t != "preview"]
              print(e["id"], ",".join(rest))
          ' | while read -r id rest; do
              if [ -z "$rest" ]; then
                curl -sS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                  "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?$TEAM" >/dev/null
              else
                body=$(REST="$rest" python3 -c 'import os,json; print(json.dumps({"target": os.environ["REST"].split(",")}))')
                code=$(curl -sS -o /tmp/env-patch.json -w '%{http_code}' \
                  -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
                  "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?$TEAM" \
                  -d "$body")
                if [ "$code" != "200" ]; then
                  echo "Failed to drop preview from shared $key (HTTP $code): $(cat /tmp/env-patch.json)"
                  exit 1
                fi
              fi
            done
          }

          upsert() {
            local key="$1"
            local value="$2"
            local type="${3:-encrypted}"
            delete_preview "$key"
            payload=$(KEY="$key" VALUE="$value" TYPE="$type" python3 -c 'import os,json; print(json.dumps({"key":os.environ["KEY"],"value":os.environ["VALUE"],"type":os.environ["TYPE"],"target":["preview"]}))')
            code=$(curl -sS -o /tmp/env-upsert.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?$TEAM" \
              -d "$payload")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Failed to set $key (HTTP $code): $(cat /tmp/env-upsert.json)"
              exit 1
            fi
            echo "set $key (preview) HTTP $code"
          }

          copy_prod_to_preview() {
            local key="$1"
            local type="${2:-encrypted}"
            read -r id shared < <(list_env | KEY="$key" python3 -c 'import os,sys,json; d=json.load(sys.stdin); k=os.environ["KEY"]; es=[e for e in d.get("envs",[]) if e.get("key")==k and "production" in (e.get("target") or [])]; e=es[0] if es else None; print((e["id"]+" "+("yes" if "preview" in (e.get("target") or []) else "no")) if e else "")') || true
            if [ -z "${id:-}" ]; then
              echo "::warning::$key is not set in Production; Preview will not have it."
              return 0
            fi
            if [ "${shared:-}" = "yes" ]; then
              echo "$key is already shared by Production and Preview; leaving it alone."
              return 0
            fi
            value=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?$TEAM&decrypt=true" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value") or "")')
            if [ -z "$value" ]; then
              echo "::warning::Could not decrypt $key from Production."
              return 0
            fi
            echo "::add-mask::$value"
            upsert "$key" "$value" "$type"
          }

          copy_prod_to_preview STRIPE_SECRET_KEY encrypted
          copy_prod_to_preview STRIPE_WEBHOOK_SECRET encrypted
          copy_prod_to_preview STRIPE_PRICE_STUDENT_MONTHLY plain
          copy_prod_to_preview STRIPE_PRICE_PROFESSIONAL_MONTHLY plain
          copy_prod_to_preview STRIPE_COUPON_FREE_MEMBERSHIP encrypted
          copy_prod_to_preview STRIPE_COMP_EMAILS encrypted
          # Checkout uses the request origin. A pinned Preview URL goes stale
          # across git-integration aliases and Actions deploys.
          delete_preview NEXT_PUBLIC_SITE_URL
          delete_preview NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          copy_prod_to_preview SUPABASE_SERVICE_ROLE_KEY encrypted
          copy_prod_to_preview GMAIL_USER encrypted
          copy_prod_to_preview GMAIL_APP_PASSWORD encrypted

          list_env | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          wanted = [
            'STRIPE_SECRET_KEY',
            'STRIPE_WEBHOOK_SECRET',
            'STRIPE_PRICE_STUDENT_MONTHLY',
            'STRIPE_PRICE_PROFESSIONAL_MONTHLY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'GMAIL_USER',
            'GMAIL_APP_PASSWORD',
          ]
          present = {e.get('key') for e in d.get('envs', []) if 'preview' in (e.get('target') or [])}
          missing = [k for k in wanted if k not in present]
          for k in wanted:
            print('preview %s: %s' % (k, 'yes' if k in present else 'NO'))
          if missing:
            print('Missing Preview env: ' + ', '.join(missing), file=sys.stderr)
            if any(k.startswith('STRIPE_') for k in missing):
              raise SystemExit(1)
          "

      # Vercel Authentication blocks CSS/JS on preview shares (HTML gets bypass,
      # assets do not) → unstyled pages. Turn it off for Preview testing.
      - name: Disable Vercel Authentication on project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/proj-patch.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -d '{"ssoProtection":null}')
          echo "PATCH project ssoProtection=null → HTTP $code"
          cat /tmp/proj-patch.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print("ssoProtection=", d.get("ssoProtection")); print("name=", d.get("name"))' || cat /tmp/proj-patch.json
          if [ "$code" != "200" ]; then
            echo "::warning::Could not disable Vercel Authentication automatically. Turn off Require Log In in Deployment Protection settings."
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-bot -->';
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **URL** | ${url} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Login** | ${url}/login |`,
              `| **Stripe webhook** | \`${url}/api/stripe/webhook\` |`,
              '',
              '_Preview only — not production. Use this Actions URL (not git-integration aliases like `design-meetup-1frw5fo0m`). Vercel Authentication is off so CSS loads on shared links._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
