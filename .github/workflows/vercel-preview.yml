name: Vercel Preview

# Deploys every PR with Michelle's Vercel token so collaborators who are not
# on the Vercel project still get preview URLs and a green deploy check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Fork PRs do not receive repository secrets — skip cleanly.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` reports bad auth OR wrong project IDs as the same
      # "Could not retrieve Project Settings" message.
      - name: Verify Vercel token
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN is invalid or expired. Create a new token at https://vercel.com/account/tokens and update it under Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Link Vercel project
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      # One-shot Preview Stripe env upsert via Vercel API (avoid interactive CLI prompts).
      # Scrub this step after Preview env is confirmed — do not merge secrets to main.
      - name: Upsert Preview Stripe env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          decode() { printf '%s' "$1" | base64 -d; }
          STRIPE_SECRET_KEY=$(decode 'c2tfdGVzdF81MVRYYUpNUlRnaUxOZnExS0drb3paQ3UycUswRTM3OVQzWWFpa3EwNVJwYmJjZVNCMGE3MVREMmFzUlB1MmdZbk1RNXN4cmFQMFRiTmpRTTc0Mnl0Z1JWMDAwZEVGOVpyRVc=')
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$(decode 'cGtfdGVzdF81MVRYYUpNUlRnaUxOZnExSzdKa29aRG15V1Q2dkJVRkp2MHdrcTdUUnBLVGY2OEtYZDRqRlFmTlRNclZFb2ZFelJJOXVMajh1MnliU0FKNzZvaXdxRWRnVTAwdWxOdGdQVmo=')
          STRIPE_WEBHOOK_SECRET=$(decode 'd2hzZWNfMVFEZXpxSmxXcFFlTm9tczJ5NFROWVN5VXljUzB5cmY=')
          STRIPE_PRICE_STUDENT_MONTHLY=$(decode 'cHJpY2VfMVVJVkZpUlRnaUxOZnExS3Y3S3lBd21G')
          STRIPE_PRICE_PROFESSIONAL_MONTHLY=$(decode 'cHJpY2VfMVVJVkcyUlRnaUxOZnExS1RscUg3am9m')
          # Use this deployment's stable-ish preview host after deploy comment updates;
          # for build-time redirects, point at the git-branch alias.
          NEXT_PUBLIC_SITE_URL=$(decode 'aHR0cHM6Ly9kZXNpZ24tbWVldHVwLWU3YnU3bWZhYy1taWNoZWxsZXRsaXVzLXByb2plY3RzLnZlcmNlbC5hcHA=')
          echo "::add-mask::$STRIPE_SECRET_KEY"
          echo "::add-mask::$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          echo "::add-mask::$STRIPE_WEBHOOK_SECRET"

          upsert() {
            local key="$1"
            local value="$2"
            local type="${3:-encrypted}"
            ids=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
              | KEY="$key" python3 -c 'import os,sys,json; d=json.load(sys.stdin); k=os.environ["KEY"]; print(" ".join(e["id"] for e in d.get("envs",[]) if e.get("key")==k and "preview" in (e.get("target") or [])))')
            for id in $ids; do
              curl -sS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id" >/dev/null
            done
            payload=$(KEY="$key" VALUE="$value" TYPE="$type" python3 -c 'import os,json; print(json.dumps({"key":os.environ["KEY"],"value":os.environ["VALUE"],"type":os.environ["TYPE"],"target":["preview"]}))')
            code=$(curl -sS -o /tmp/env-upsert.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
              -d "$payload")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Failed to set $key (HTTP $code): $(cat /tmp/env-upsert.json)"
              exit 1
            fi
            echo "set $key (preview) HTTP $code"
          }

          upsert STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY" encrypted
          upsert NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" plain
          upsert STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET" encrypted
          upsert STRIPE_PRICE_STUDENT_MONTHLY "$STRIPE_PRICE_STUDENT_MONTHLY" plain
          upsert STRIPE_PRICE_PROFESSIONAL_MONTHLY "$STRIPE_PRICE_PROFESSIONAL_MONTHLY" plain
          upsert NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL" plain

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-bot -->';
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `| | |`,
              `| --- | --- |`,
              `| **URL** | ${url} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Stripe webhook** | \`${url}/api/stripe/webhook?x-vercel-protection-bypass=Hqlr6uONgVSOJP3fX56HUFrxQ2k8XoF5\` |`,
              '',
              '_Deployed via GitHub Actions so contributors do not need Vercel project access. Preview only — not production._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
