name: Vercel Production

# Uses the Vercel REST API (not the CLI). App/integration tokens (vcp_*) can
# create deployments via the API but fail on `vercel whoami` / `vercel pull`.
on:
  push:
    branches: [main]

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Verify Vercel token
        run: |
          code=$(curl -sS -o /tmp/vercel-projects.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN cannot access project (HTTP $code). Create a token at https://vercel.com/account/tokens and confirm VERCEL_ORG_ID / VERCEL_PROJECT_ID."
            cat /tmp/vercel-projects.json
            exit 1
          fi

      - name: Deploy production
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg name "design-meetup-web" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "main" \
            --arg sha "${{ github.sha }}" \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref,
                sha: $sha
              }
            }')

          response=$(curl -sS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")

          id=$(echo "$response" | jq -r '.id // empty')
          url=$(echo "$response" | jq -r '.url // empty')
          if [ -z "$id" ] || [ -z "$url" ]; then
            echo "$response" | jq .
            echo "::error::Failed to create Vercel production deployment."
            exit 1
          fi

          echo "Created deployment $id → https://$url"

          for i in $(seq 1 90); do
            status_json=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_ORG_ID}")
            state=$(echo "$status_json" | jq -r '.readyState // empty')
            echo "readyState=$state (attempt $i)"
            case "$state" in
              READY)
                echo "Production URL: https://$url"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "$status_json" | jq .
                echo "::error::Vercel deployment ended in $state"
                exit 1
                ;;
            esac
            sleep 4
          done

          echo "::error::Timed out waiting for Vercel deployment $id"
          exit 1
