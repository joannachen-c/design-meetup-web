<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#ffffff;color:#191919;font-family:Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;">
      <tr>
        <td align="left" style="padding:40px 32px 48px;">
          <a href="https://designmeetup.info" style="display:inline-block;line-height:0;text-decoration:none;">
            <img src="https://designmeetup.info/design-meetup-logo.png" alt="Design Meetup" width="48" height="48" style="display:block;border:0;outline:none;border-radius:50%;">
          </a>
          <h1 style="margin:32px 0 16px;font-size:28px;line-height:1.1;letter-spacing:-0.04em;font-weight:700;color:#191919;">Reset your Design Meetup password</h1>
          <p style="margin:0 0 16px;max-width:460px;font-size:16px;line-height:1.5;color:#191919;">This is a password reset for your Design Meetup account. Click below to choose a new password.</p>
          <p style="margin:0 0 28px;max-width:460px;font-size:16px;line-height:1.5;color:#191919;">If you didn't ask for this, you can ignore this email.</p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td bgcolor="#191919" style="background:#191919;border-radius:10px;">
                <a href="https://designmeetup.info/reset-password?token_hash={{ .TokenHash }}&type=recovery" target="_blank" style="display:inline-block;background:#191919;color:#ffffff;text-decoration:none;font-weight:600;font-size:16px;line-height:1;padding:14px 22px;border-radius:10px;">Reset Password</a>
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:40px;">
            <tr>
              <td style="border-top:1px solid #ececec;font-size:0;line-height:0;height:1px;">&nbsp;</td>
            </tr>
          </table>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:24px;">
            <tr>
              <td style="padding:0 16px 0 0;vertical-align:middle;"><a href="https://designmeetup.substack.com/" style="display:inline-block;line-height:0;text-decoration:none;" aria-label="Substack"><img src="https://designmeetup.info/email/substack.png" alt="Substack" width="20" height="20" style="display:block;border:0;outline:none;"></a></td>
              <td style="padding:0 16px 0 0;vertical-align:middle;"><a href="https://www.instagram.com/designmeetup/" style="display:inline-block;line-height:0;text-decoration:none;" aria-label="Instagram"><img src="https://designmeetup.info/email/instagram.png" alt="Instagram" width="20" height="20" style="display:block;border:0;outline:none;"></a></td>
              <td style="padding:0 16px 0 0;vertical-align:middle;"><a href="https://www.linkedin.com/company/design-meetup/" style="display:inline-block;line-height:0;text-decoration:none;" aria-label="LinkedIn"><img src="https://designmeetup.info/email/linkedin.png" alt="LinkedIn" width="20" height="20" style="display:block;border:0;outline:none;"></a></td>
              <td style="padding:0 16px 0 0;vertical-align:middle;"><a href="https://x.com/designmeetuphq" style="display:inline-block;line-height:0;text-decoration:none;" aria-label="X"><img src="https://designmeetup.info/email/x.png" alt="X" width="20" height="20" style="display:block;border:0;outline:none;"></a></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
